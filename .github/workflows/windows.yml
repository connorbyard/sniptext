name: Windows Build

on:
   workflow_dispatch:
   push:
      branches:
         - main

jobs:
   build:
      runs-on: windows-2022

      steps:
         - name: Checkout Sniptext
           uses: actions/checkout@v5

         - name: Checkout Odin
           uses: actions/checkout@v5
           with:
              repository: odin-lang/Odin
              path: odin
              lfs: true

         - name: Build Odin
           shell: cmd
           run: |
              call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
              cd odin
              call build.bat 1

         - name: Check Odin
           shell: cmd
           run: |
              odin\odin.exe version

         - name: Build Sniptext
           shell: cmd
           run: |
              call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
              odin\odin.exe build src -out:sniptext.exe

         - name: Upload executable
           uses: actions/upload-artifact@v4
           with:
              name: sniptext-windows-x64
              path: sniptext.exe
